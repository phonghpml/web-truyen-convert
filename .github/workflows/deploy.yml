name: Deploy Backend to HF
on:
  push:
    branches: [main, deploy]
    paths:
      - 'backend/**' # Chỉ chạy khi có thay đổi trong thư mục backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Push Backend Folder to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # 1. Đi vào thư mục backend
          cd backend

          # 2. Khởi tạo Git mới tại đây để xóa sạch lịch sử file > 10MB
          git init
          git config --global init.defaultBranch main
          git config user.email "phongphml@gmail.com"
          git config user.name "phongphml"

          # 3. Xóa model lớn khỏi payload deploy; ignore đơn thuần không đủ nếu file đã có trong working tree hoặc đã từng được track
          rm -rf .nghitts-models
          find . -type f \( -name "*.onnx" -o -name "*.onnx.json" \) -delete

          # 4. Kiểm tra cuối cùng: chưa được để model lớn nào còn ở backend
          if [ -d .nghitts-models ] || find . -type f \( -name "*.onnx" -o -name "*.onnx.json" \) | grep -q .; then
            echo "ERROR: Large TTS model files are still in the deploy payload. They must be excluded from the HF Space repo and downloaded during Docker build."
            find . -type f \( -name "*.onnx" -o -name "*.onnx.json" \) -print
            exit 1
          fi

          # 5. Thêm toàn bộ file hiện tại (đã chia nhỏ < 10MB)
          git add .
          git commit -m "Deploy clean version without large files"

          # 6. Ép buộc đẩy lên Hugging Face (Dùng -f)
          # Lưu ý: nhánh mặc định của 'git init' thường là 'master', nên ta đẩy master:main
          git push -f https://Phonghp:${{ secrets.HF_TOKEN }}@huggingface.co/spaces/Phonghp/crawler master:main
